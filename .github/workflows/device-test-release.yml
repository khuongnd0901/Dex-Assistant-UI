          KTzM4imjjXOBxza9rOn610xM82YUpS/Horb6gzrnofuIwqW7ojGiDiy0jvlakD3h
          BkvEdBGf6DxrBm0jw/JdDd2vOluBrW8bshuKY4RiIcZnsq/bEWfDnq9Is/C7I+cg
          ufY2aSjUcqeq+QexjBGjcEwMLzVARDLUmGK72rWP4erGDW/RvmIpgEiBY3KV/pAh
          h0f0czNiYB+VYS9Crquv
          -----END CERTIFICATE-----
          CERT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$tmpdir/keystore"
          mkdir encrypted
          openssl cms -encrypt -binary -aes-256-cbc -in "$tmpdir/keystore" -out encrypted/keystore.cms -outform DER "$tmpdir/recipient.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-signing-recovery
          path: encrypted/keystore.cms
          retention-days: 1
          if-no-files-found: error
